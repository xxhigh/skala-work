<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="모의 면접 공통 질문에 답변을 작성하고 로컬에 저장하는 면접 답변 노트">
  <title>면접 답변 노트</title>
  <style>
    /* Hallmark · macrostructure: Conversational FAQ · tone: austere · anchor hue: blue
     * theme: Almanac · enrichment: none · pre-emit critique: P5 H5 E5 S5 R5 V5
     * contrast: pass · responsive: pass · single-file: user requested
     */
    :root {
      --paper: oklch(98% 0.008 85); --paper-2: oklch(95% 0.01 85);
      --ink: oklch(20% 0.014 255); --ink-2: oklch(34% 0.016 255);
      --muted: oklch(45% 0.014 255); --rule: oklch(82% 0.012 255);
      --accent: oklch(43% 0.15 253); --accent-soft: oklch(93% 0.035 253);
      --focus: oklch(54% 0.19 253); --danger: oklch(45% 0.16 28);
      --danger-soft: oklch(94% 0.03 28);
      --display: "Iowan Old Style", "Noto Serif KR", ui-serif, serif;
      --body: "Apple SD Gothic Neo", "Noto Sans KR", ui-sans-serif, sans-serif;
      --mono: "SFMono-Regular", ui-monospace, monospace;
      --xs: .5rem; --sm: .75rem; --md: 1rem; --lg: 1.5rem;
      --xl: 2.5rem; --2xl: 4rem; --fast: 120ms;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 20rem; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 1rem/1.6 var(--body); }
    button, input, select, textarea { font: inherit; }
    button, input, select, textarea { border: 1px solid var(--rule); outline: 2px solid transparent; outline-offset: 2px; }
    :focus-visible { outline-color: var(--focus); }
    .page { width: min(100% - 2rem, 66rem); margin-inline: auto; }
    .masthead { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--lg); padding-block: var(--xl) var(--2xl); border-block-end: 1px solid var(--ink); }
    h1, h2 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-family: var(--display); font-style: normal; letter-spacing: -.035em; }
    h1 { font-size: clamp(2.25rem, 6vw, 4.25rem); line-height: 1.05; }
    h2 { font-size: 1.5625rem; line-height: 1.35; white-space: pre-line; }
    .masthead__aside { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: var(--xs); color: var(--muted); }
    .masthead__aside p { max-width: 48ch; margin: 0; }
    .save-status { color: var(--accent); font: .75rem var(--mono); font-variant-numeric: tabular-nums; }
    .top-actions { display: flex; flex-wrap: wrap; gap: var(--xs); margin-block-start: var(--xs); }
    .action-button { min-height: 2.75rem; padding-inline: var(--md); border-radius: .375rem; background: var(--paper); color: var(--ink); cursor: pointer; font-size: .875rem; font-weight: 700; white-space: nowrap; transition: background-color var(--fast) var(--ease-out), transform var(--fast) var(--ease-out); }
    .action-button:active { transform: translateY(1px); }
    .action-button:disabled { opacity: .5; cursor: not-allowed; }
    .file-input { display: none; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--md); padding-block: var(--lg); border-block-end: 1px solid var(--rule); }
    .field, .answer-field { display: grid; gap: var(--xs); min-width: 0; }
    label { color: var(--ink-2); font-size: .875rem; font-weight: 700; }
    input, select, textarea { width: 100%; border-radius: .375rem; background: var(--paper); color: var(--ink); }
    input, select { min-height: 3rem; padding-inline: var(--sm); }
    textarea { min-height: 10rem; padding: var(--md); resize: vertical; line-height: 1.7; }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--accent); }
    input:disabled, select:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; background: var(--paper-2); }
    textarea[data-filled="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
    .answer-compose { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--xs); align-items: end; }
    .answer-compose__actions { display: flex; gap: var(--xs); }
    .add-button { min-height: 2.75rem; padding-inline: var(--md); border-radius: .375rem; border-color: var(--accent); background: var(--accent); color: var(--paper); cursor: pointer; font-size: .875rem; font-weight: 700; white-space: nowrap; transition: background-color var(--fast) var(--ease-out), transform var(--fast) var(--ease-out); }
    .add-button:active { transform: translateY(1px); }
    .add-button:disabled { opacity: .5; cursor: not-allowed; }
    .cancel-button { min-height: 2.75rem; padding-inline: var(--sm); border-radius: .375rem; background: var(--paper); color: var(--muted); cursor: pointer; font-size: .875rem; white-space: nowrap; }
    .saved-answers { display: grid; gap: var(--xs); margin-block-start: var(--md); }
    .saved-answers__title { margin: 0; color: var(--ink-2); font-size: .875rem; }
    .answer-item { display: grid; gap: var(--sm); padding: var(--md); border-block-start: 1px solid var(--rule); background: var(--paper-2); color: var(--ink); }
    .answer-item__text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .answer-item__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sm); color: var(--muted); font-size: .75rem; }
    .answer-item__actions { display: flex; gap: var(--xs); opacity: 0; pointer-events: none; transition: opacity var(--fast) var(--ease-out); }
    .answer-item:hover .answer-item__actions, .answer-item:focus-within .answer-item__actions { opacity: 1; pointer-events: auto; }
    .item-button { min-height: 2.75rem; padding-inline: var(--sm); border-radius: .375rem; background: var(--paper); color: var(--ink-2); cursor: pointer; font-size: .75rem; font-weight: 700; white-space: nowrap; }
    .item-button--delete { color: var(--danger); }
    .progress { display: flex; align-items: center; justify-content: space-between; gap: var(--md); padding-block: var(--xl) var(--sm); color: var(--muted); font-size: .875rem; }
    .progress strong { color: var(--ink); font: 1.25rem var(--mono); font-variant-numeric: tabular-nums; }
    .clear-button { min-height: 2.75rem; padding-inline: var(--md); border-radius: .375rem; background: transparent; color: var(--danger); cursor: pointer; font-size: .875rem; font-weight: 700; white-space: nowrap; transition: background-color var(--fast) var(--ease-out), transform var(--fast) var(--ease-out); }
    .clear-button:active { transform: translateY(1px); }
    .clear-button:disabled { opacity: .5; cursor: not-allowed; }
    .question-list { display: grid; }
    .question { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--lg); padding-block: var(--xl); border-block-end: 1px solid var(--rule); }
    .question__head { display: grid; align-content: start; gap: var(--sm); min-width: 0; }
    .question__meta { display: flex; flex-wrap: wrap; gap: var(--xs) var(--sm); color: var(--muted); font-size: .75rem; }
    .question__area { color: var(--accent); font-weight: 800; }
    .answer-field__foot { display: flex; justify-content: space-between; gap: var(--sm); min-height: 1.25rem; color: var(--muted); font-size: .75rem; }
    .empty-state { padding-block: var(--2xl); color: var(--muted); text-align: center; }
    .footnote { display: flex; justify-content: space-between; gap: var(--md); padding-block: var(--lg) var(--2xl); color: var(--muted); font-size: .75rem; }
    @media (hover: hover) and (pointer: fine) {
      input:hover, select:hover, textarea:hover { background: var(--paper-2); }
      textarea[data-filled="true"]:hover { background: var(--accent-soft); }
      .action-button:hover { background: var(--accent-soft); color: var(--ink); }
      .add-button:hover { background: var(--ink); color: var(--paper); }
      .item-button:hover { background: var(--accent-soft); color: var(--ink); }
      .item-button--delete:hover { background: var(--danger-soft); color: var(--danger); }
      .clear-button:hover { background: var(--danger-soft); color: var(--danger); }
    }
    @media (min-width: 44rem) {
      .masthead { grid-template-columns: minmax(0, 1.35fr) minmax(16rem, .65fr); }
      .toolbar { grid-template-columns: minmax(0, 1.4fr) minmax(15rem, .6fr); }
      .answer-compose { grid-template-columns: minmax(0, 1fr) auto; }
      .answer-compose__actions { flex-direction: column; }
    }
    @media (max-width: 43.999rem) {
      .page { width: min(100% - 1.5rem, 66rem); }
      .footnote { flex-direction: column; }
    }
    @media (hover: none), (pointer: coarse) { .answer-item__actions { opacity: 1; pointer-events: auto; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>면접 답변 노트</h1>
      <div class="masthead__aside">
        <p>질문마다 답변을 여러 개 기록할 수 있습니다. 추가한 답변은 이 브라우저에 저장됩니다.</p>
        <span class="save-status" id="save-status" role="status" aria-live="polite">저장 준비</span>
        <div class="top-actions">
          <button class="action-button" id="export-button" type="button">JSON 내보내기</button>
          <button class="action-button" id="import-button" type="button">JSON 가져오기</button>
          <input class="file-input" id="import-input" type="file" accept="application/json,.json">
        </div>
      </div>
    </header>
    <main>
      <section class="toolbar" aria-label="질문 필터">
        <div class="field">
          <label for="search">질문 검색</label>
          <input id="search" type="search" placeholder="예: 지원동기, 갈등, AI" autocomplete="off">
        </div>
        <div class="field">
          <label for="area-filter">평가 영역</label>
          <select id="area-filter"><option value="all">전체 평가 영역</option></select>
        </div>
      </section>
      <div class="progress">
        <span><strong id="answered-count">0</strong> / <span id="total-count">41</span>개 질문 답변 완료 · 총 <span id="response-count">0</span>개 답변</span>
        <button class="clear-button" id="clear-button" type="button">모든 답변 지우기</button>
      </div>
      <section class="question-list" id="question-list" aria-label="모의 면접 공통 질문"></section>
    </main>
    <footer class="footnote">
      <span>답변은 서버로 전송되지 않으며 현재 브라우저에만 저장됩니다.</span>
      <span>질문 출처: interview_common_question.csv</span>
    </footer>
  </div>
  <script>
    const STORAGE_KEY = "interview-answer-note.v1";
    const questions = [
      {id:1,area:"A. 지원동기·기업이해",type:"지원동기·자기주도성",title:"이 회사 또는 직무에 관심을 갖게 된 계기는 무엇입니까?\n지원하는데 영향을 준 사람이 있는지?"},
      {id:2,area:"A. 지원동기·기업이해",type:"지원동기·회사 적합성",title:"우리 회사에 지원한 동기가 무엇인지?"},
      {id:3,area:"A. 지원동기·기업이해",type:"회사·사업 통찰",title:"지원 기업이 현재 직면하고 있는 주요 과제 한 가지를 선정하고, 그 이유와 대응방안을 설명해 보세요\n우리 회사가 당면한 가장 큰 문제는 무엇인지? 어떻게 해결해야 하는지?"},
      {id:4,area:"A. 지원동기·기업이해",type:"기초 경영지식",title:"회사가 수익을 창출하는 기본적인 사업구조 또는 Business Model을 이해하고 있습니까?\n재무제표가 무엇인지 아는지?"},
      {id:5,area:"B. 직무이해·직무적합성",type:"직무이해·지원동기",title:"희망(지원) 부서/직무를 선택한 이유는?"},
      {id:6,area:"B. 직무이해·직무적합성",type:"직무이해",title:"지원한 직무의 주요 역할과 업무를 본인이 이해한 대로 설명해 보세요\n지원 부서가 어떤 일을 하는지 알고 있는지? 설명해 보세요."},
      {id:7,area:"B. 직무이해·직무적합성",type:"직무적합성",title:"희망(지원) 부서/직무의 어떤 점이 본인과 맞는다고 생각하는지?"},
      {id:8,area:"B. 직무이해·직무적합성",type:"자기개발·준비도",title:"지원 직무를 위해 지금까지 어떤 준비를 해왔으며, 아직 부족하다고 생각하는 역량과 보완 계획은 무엇입니까?\n어떻게 취업을 준비했고 무엇을 준비했는지? 아직도 부족하다고 느끼는 점은?"},
      {id:9,area:"B. 직무이해·직무적합성",type:"직무수행·문제해결",title:"지원 직무를 수행하면서 예상되는 가장 큰 어려움은 무엇이며, 이를 어떻게 극복하겠습니까?\n직무 수행 중 예상되는 가장 큰 어려움은?"},
      {id:10,area:"B. 직무이해·직무적합성",type:"직무선호·유연성",title:"희망 직무와 다른 직무 또는 부서에 배치된다면 어떻게 하겠습니까?\n작성(지원) 부서 말고 다른 데 희망하는 곳이 있는지?"},
      {id:11,area:"C. 경험·성과·주도성",type:"도전·성과",title:"스스로 높은 목표를 설정하고 끝까지 달성했던 경험을 설명해 주세요"},
      {id:12,area:"C. 경험·성과·주도성",type:"실패경험·회복탄력성",title:"목표를 달성하지 못했거나 실패했던 경험과 그 경험을 통해 무엇을 배웠습니까?"},
      {id:13,area:"C. 경험·성과·주도성",type:"경험·다양성",title:"학업 외 활동 중 꾸준히 참여하거나 책임을 맡아 수행했던 경험이 있다면 설명해 주세요. 그 과정에서 무엇을 배웠습니까?\n지금까지 학업 이외 활동한 게 있는지? 자료에 있는 것 말고 다른 활동(예: 동호회) 또는 취미가 있는지?"},
      {id:14,area:"C. 경험·성과·주도성",type:"책임감·Ownership",title:"본인의 역할 범위를 넘어서는 일이었지만 문제 해결을 위해 책임감을 가지고 행동했던 경험이 있습니까?"},
      {id:15,area:"C. 경험·성과·주도성",type:"문제해결·개선",title:"기존 방식의 문제점을 발견하고 스스로 개선했던 경험이 있습니까?"},
      {id:16,area:"C. 경험·성과·주도성",type:"우선순위·시간관리",title:"여러 과제나 업무가 동시에 주어졌을 때 우선순위를 조정해 완료했던 경험을 설명해 주세요."},
      {id:17,area:"D. 협업·커뮤니케이션",type:"협업·팀워크",title:"팀으로 목표를 수행했던 경험 중 본인이 맡은 역할과 기여를 설명해 주세요"},
      {id:18,area:"D. 협업·커뮤니케이션",type:"갈등관리·커뮤니케이션",title:"다른 사람과 의견 충돌이 있었던 경험과 어떻게 해결했는지 설명해 주세요"},
      {id:19,area:"D. 협업·커뮤니케이션",type:"협업·갈등관리",title:"부서 내 비협조적인 동료가 있다면?"},
      {id:20,area:"D. 협업·커뮤니케이션",type:"협업·갈등관리",title:"업무 수행 과정에서 상사와 의견이 다를 경우 어떻게 하겠습니까?\n상사와 의견이 다르면?"},
      {id:21,area:"D. 협업·커뮤니케이션",type:"협업성향",title:"혼자 수행하는 업무와 협업이 필요한 업무 중 어느 환경에서 강점이 있다고 생각하며, 상황에 따라 어떻게 업무방식을 조정합니까?\n혼자 일하는 것을 좋아하는지? 아니면 함께 일하는 것을 선호하는지? 이유는?"},
      {id:22,area:"D. 협업·커뮤니케이션",type:"창의성·커뮤니케이션",title:"본인의 직무 지식을 다른 사람에게 쉽게 설명하거나 공유한다면 어떤 주제를 어떤 방식으로 전달하고 싶습니까?\n본인이 수행하는 업무와 관련해서 유튜브에 콘텐츠를 올릴 수 있다면 어떤 것을 올리고 싶은지?"},
      {id:23,area:"E. 문제해결·상황판단",type:"변화대응·적응력",title:"예상하지 못한 상황이나 계획 변경에 대응했던 경험을 설명해 주세요"},
      {id:24,area:"E. 문제해결·상황판단",type:"혁신·개선",title:"지원 직무와 관련하여 개선하거나 새롭게 시도해 보고 싶은 아이디어가 있다면 설명해 보세요\n지원 부서 업무나 기능 중 어떤 것을 바꿔보고 싶은지? 획기적인 아이디어가 있는지?"},
      {id:25,area:"E. 문제해결·상황판단",type:"종합 Case·의사결정",title:"현재 사용 중인 방법보다 비용은 낮고 성능은 더 좋아 보이는 새로운 대안이 발견되었습니다. 다만 검증 경험이 부족합니다. 기존 방식을 유지할지 새로운 방식을 도입할지 어떻게 판단하겠습니까?\nA 유지보수 업체와 계약을 체결해서 유지보수를 하고 있는데, A 업체가 사용하는 부품/제품이 외국산이라는 것을 알게 되었습니다. 국내산을 사용할 경우 원가 절감도 되고 기술 측면에서도 우수한 것 같은데 현재 유지보수 기간이 다 되어가는 상황입니다. 어떻게 하겠는지?"},

      {id:27,area:"F. 자기이해·가치관·윤리",type:"자기이해·개선",title:"자신의 단점은 무엇이고 앞으로 어떻게 보완해 나갈 건지?"},
      {id:28,area:"F. 자기이해·가치관·윤리",type:"자기인식·인성",title:"본인은 어떤 사람이라고 생각하는지?"},
      {id:29,area:"F. 자기이해·가치관·윤리",type:"가치관·인성",title:"본인이 생각하는 가장 중요한 가치는 무엇인지?"},

      {id:31,area:"F. 자기이해·가치관·윤리",type:"윤리·Compliance",title:"상사의 지시가 회사 규정이나 원칙에 어긋난다고 판단된다면 어떻게 하겠습니까?\n상사의 부당한 지시가 있다면?"},

      {id:37,area:"G. 성장·변화·자기관리",type:"조직적응·업무태도",title:"입사 후 맡게 된 업무가 본인이 기대하거나 생각했던 업무와 다르다면 어떻게 하겠습니까?\n주어진 업무가 생각했던 것과 다르면?"},
      {id:38,area:"H. 산업·비즈니스·AI & 디지털",type:"산업·Biz Domain 통찰",title:"현재 우리 회사가 수행하는 Biz Domain과 관련해서 해결해야 할 가장 심각한 문제는 무엇인지?"},
      {id:39,area:"H. 산업·비즈니스·AI & 디지털",type:"회사·산업 이해",title:"지원한 회사나 산업에서 중요하다고 생각하는 법규·규제·윤리 또는 Compliance 이슈가 있다면 설명해 보세요\n우리 회사와 관련된 국내외 규제나 Compliance 요건은 무엇이 있는지?"},
      {id:40,area:"H. 산업·비즈니스·AI & 디지털",type:"AI 활용·디지털 역량",title:"업무 생산성을 높이기 위해 생성형 AI를 어떻게 활용할 수 있다고 생각하며, 사용할 때 주의해야 할 점은 무엇입니까?"},
      {id:41,area:"I. 마무리",type:"종합·마무리",title:"마지막으로 하고 싶은 말"}
    ];
    const list=document.querySelector("#question-list"), search=document.querySelector("#search"), areaFilter=document.querySelector("#area-filter"), answeredCount=document.querySelector("#answered-count"), totalCount=document.querySelector("#total-count"), responseCount=document.querySelector("#response-count"), saveStatus=document.querySelector("#save-status"), clearButton=document.querySelector("#clear-button"), exportButton=document.querySelector("#export-button"), importButton=document.querySelector("#import-button"), importInput=document.querySelector("#import-input");
    let answers=loadAnswers();
    const drafts={},editing={};
    function loadAnswers(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!saved||typeof saved!=="object"||Array.isArray(saved))return {};
        return Object.fromEntries(Object.entries(saved).map(([id,value])=>[id,Array.isArray(value)?value.filter(answer=>typeof answer==="string"&&answer.trim()):typeof value==="string"&&value.trim()?[value]:[]]).filter(([,value])=>value.length));
      }catch{return {}}
    }
    function persist(message="저장됨"){
      localStorage.setItem(STORAGE_KEY,JSON.stringify(answers));
      saveStatus.textContent=`${message} · ${new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit"}).format(new Date())}`;
    }
    function exportAnswers(){
      const data={format:"interview-answer-note",version:2,exportedAt:new Date().toISOString(),answers:questions.filter(q=>(answers[q.id]||[]).length).map(q=>({questionId:q.id,area:q.area,type:q.type,question:q.title,responses:answers[q.id].map(answer=>({answer,characterCount:answer.length}))}))};
      const count=data.answers.reduce((sum,item)=>sum+item.responses.length,0),blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");
      link.href=url;link.download=`interview-answers-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),0);
      saveStatus.textContent=`내보내기 완료 · ${count}개 답변`;
    }
    async function importAnswers(){
      const file=importInput.files[0];if(!file)return;
      try{
        const data=JSON.parse(await file.text());
        if(data?.format!=="interview-answer-note"||![1,2].includes(data?.version)||!Array.isArray(data.answers))throw new Error("invalid-format");
        const validIds=new Set(questions.map(q=>q.id)),imported={};
        data.answers.forEach(item=>{
          const id=Number(item.questionId);if(!validIds.has(id))return;
          const values=data.version===1?[item.answer]:(item.responses||[]).map(response=>typeof response==="string"?response:response?.answer);
          const valid=values.filter(value=>typeof value==="string"&&value.trim());if(valid.length)imported[id]=valid;
        });
        if(totalResponses()&&!confirm("가져온 JSON의 답변으로 현재 답변을 교체할까요?"))return;
        answers=imported;Object.keys(drafts).forEach(key=>delete drafts[key]);Object.keys(editing).forEach(key=>delete editing[key]);persist("가져오기 완료");updateProgress();render();
      }catch{alert("JSON 파일을 가져오지 못했습니다. 이 페이지에서 내보낸 파일인지 확인해 주세요.")}
      finally{importInput.value=""}
    }
    function filtered(){const term=search.value.trim().toLocaleLowerCase("ko"),area=areaFilter.value;return questions.filter(q=>(area==="all"||q.area===area)&&(!term||`${q.area} ${q.type} ${q.title}`.toLocaleLowerCase("ko").includes(term)))}
    function totalResponses(){return Object.values(answers).reduce((sum,items)=>sum+items.length,0)}
    function updateProgress(){const answered=questions.filter(q=>(answers[q.id]||[]).length).length,total=totalResponses();answeredCount.textContent=answered;responseCount.textContent=total;clearButton.disabled=total===0}
    function saveResponse(questionId){
      const value=String(drafts[questionId]||"").trim();if(!value)return;
      const items=answers[questionId]?[...answers[questionId]]:[];
      if(Number.isInteger(editing[questionId]))items[editing[questionId]]=value;else items.push(value);
      answers[questionId]=items;drafts[questionId]="";delete editing[questionId];persist();updateProgress();render();
    }
    function editResponse(questionId,index){drafts[questionId]=answers[questionId][index];editing[questionId]=index;render();requestAnimationFrame(()=>{const textarea=document.querySelector(`#answer-${questionId}`);textarea?.focus();textarea?.scrollIntoView({behavior:"smooth",block:"center"})})}
    function deleteResponse(questionId,index){
      const items=[...(answers[questionId]||[])];items.splice(index,1);if(items.length)answers[questionId]=items;else delete answers[questionId];
      if(editing[questionId]===index){drafts[questionId]="";delete editing[questionId]}else if(editing[questionId]>index)editing[questionId]-=1;
      persist("삭제됨");updateProgress();render();
    }
    function render(){
      const items=filtered();list.replaceChildren();if(!items.length){const p=document.createElement("p");p.className="empty-state";p.textContent="조건에 맞는 질문이 없습니다.";list.append(p);return}
      const fragment=document.createDocumentFragment();items.forEach(q=>{
        const article=document.createElement("article");article.className="question";
        const head=document.createElement("div");head.className="question__head";
        const meta=document.createElement("div");meta.className="question__meta";
        const area=document.createElement("span");area.className="question__area";area.textContent=q.area;
        const type=document.createElement("span");type.textContent=q.type;meta.append(area,type);
        const title=document.createElement("h2");title.id=`question-${q.id}`;title.textContent=q.title;head.append(meta,title);
        const field=document.createElement("div");field.className="answer-field";
        const label=document.createElement("label");label.id=`answer-${q.id}-label`;label.htmlFor=`answer-${q.id}`;label.textContent=Number.isInteger(editing[q.id])?"답변 수정":"새 답변";
        const compose=document.createElement("div");compose.className="answer-compose";
        const textarea=document.createElement("textarea");textarea.id=`answer-${q.id}`;textarea.value=drafts[q.id]||"";textarea.placeholder="여기에 답변을 작성하세요.";textarea.setAttribute("aria-labelledby",`${title.id} ${label.id}`);textarea.dataset.filled=String(Boolean(textarea.value.trim()));
        const composeActions=document.createElement("div");composeActions.className="answer-compose__actions";
        const addButton=document.createElement("button");addButton.className="add-button";addButton.type="button";addButton.textContent=Number.isInteger(editing[q.id])?"수정 저장":"답변 추가";addButton.disabled=!textarea.value.trim();addButton.addEventListener("click",()=>saveResponse(q.id));composeActions.append(addButton);
        if(Number.isInteger(editing[q.id])){const cancel=document.createElement("button");cancel.className="cancel-button";cancel.type="button";cancel.textContent="수정 취소";cancel.addEventListener("click",()=>{drafts[q.id]="";delete editing[q.id];render()});composeActions.append(cancel)}
        compose.append(textarea,composeActions);
        const foot=document.createElement("div");foot.className="answer-field__foot";const helper=document.createElement("span");helper.textContent="답변 추가를 누르면 아래 목록에 저장됩니다.";const length=document.createElement("span");length.textContent=`${textarea.value.length.toLocaleString("ko-KR")}자`;foot.append(helper,length);
        textarea.addEventListener("input",()=>{drafts[q.id]=textarea.value;textarea.dataset.filled=String(Boolean(textarea.value.trim()));length.textContent=`${textarea.value.length.toLocaleString("ko-KR")}자`;addButton.disabled=!textarea.value.trim()});
        field.append(label,compose,foot);
        const saved=answers[q.id]||[];if(saved.length){
          const savedList=document.createElement("section");savedList.className="saved-answers";savedList.setAttribute("aria-label","저장된 답변 목록");
          const savedTitle=document.createElement("h3");savedTitle.className="saved-answers__title";savedTitle.textContent=`내가 작성한 답변 ${saved.length}개`;savedList.append(savedTitle);
          saved.forEach((answer,index)=>{const item=document.createElement("article");item.className="answer-item";const text=document.createElement("p");text.className="answer-item__text";text.textContent=answer;const itemFoot=document.createElement("div");itemFoot.className="answer-item__foot";const count=document.createElement("span");count.textContent=`${answer.length.toLocaleString("ko-KR")}자`;const actions=document.createElement("div");actions.className="answer-item__actions";const edit=document.createElement("button");edit.className="item-button";edit.type="button";edit.textContent="수정";edit.addEventListener("click",()=>editResponse(q.id,index));const remove=document.createElement("button");remove.className="item-button item-button--delete";remove.type="button";remove.textContent="삭제";remove.addEventListener("click",()=>deleteResponse(q.id,index));actions.append(edit,remove);itemFoot.append(count,actions);item.append(text,itemFoot);savedList.append(item)});field.append(savedList)
        }
        article.append(head,field);fragment.append(article)
      });list.append(fragment)
    }
    [...new Set(questions.map(q=>q.area))].forEach(area=>areaFilter.add(new Option(area,area)));
    search.addEventListener("input",render);areaFilter.addEventListener("change",render);
    exportButton.addEventListener("click",exportAnswers);
    importButton.addEventListener("click",()=>importInput.click());
    importInput.addEventListener("change",importAnswers);
    clearButton.addEventListener("click",()=>{if(!confirm("작성한 모든 답변을 지울까요? 이 작업은 되돌릴 수 없습니다."))return;answers={};persist();updateProgress();render()});
    window.addEventListener("pagehide",()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(answers)));
    totalCount.textContent=questions.length;updateProgress();render();
  </script>
