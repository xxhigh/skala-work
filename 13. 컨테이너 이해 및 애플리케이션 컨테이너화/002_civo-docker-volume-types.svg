<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Docker volume types</title>
<desc>Structural diagram comparing three Docker volume types: named volume, bind mount, and anonymous volume, shown against the host filesystem and container layer. Civo brand colours.</desc>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888178" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Card background -->
<rect x="20" y="16" width="640" height="388" rx="16" fill="#D1CCBE" stroke="#00000022" stroke-width="1"/>

<!-- Title -->
<text x="340" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#000000">Docker volume types</text>

<!-- NAMED VOLUME -->
<rect x="40" y="64" width="182" height="316" rx="12" fill="#C4BFB0" stroke="#00000018" stroke-width="0.5"/>
<text x="131" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#000000">Named volume</text>
<rect x="56" y="100" width="150" height="52" rx="8" fill="#000000"/>
<text x="131" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Container</text>
<text x="131" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#D1CCBE" dominant-baseline="central">/usr/share</text>
<line x1="131" y1="152" x2="131" y2="186" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="131" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#444444" dominant-baseline="central">Docker-managed</text>
<rect x="56" y="210" width="150" height="52" rx="8" fill="#00FF6F"/>
<text x="131" y="231" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#000000" dominant-baseline="central">demo</text>
<text x="131" y="249" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#000000" dominant-baseline="central">/var/lib/docker/volumes</text>
<line x1="131" y1="262" x2="131" y2="296" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="56" y="306" width="150" height="44" rx="8" fill="#888178"/>
<text x="131" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Host filesystem</text>
<rect x="64" y="348" width="134" height="20" rx="4" fill="#00000015"/>
<text x="131" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#000000" dominant-baseline="central">Persists after container removed</text>

<!-- BIND MOUNT -->
<rect x="249" y="64" width="182" height="316" rx="12" fill="#C4BFB0" stroke="#00000018" stroke-width="0.5"/>
<text x="340" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#000000">Bind mount</text>
<rect x="265" y="100" width="150" height="52" rx="8" fill="#000000"/>
<text x="340" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Container</text>
<text x="340" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#D1CCBE" dominant-baseline="central">/temp</text>
<line x1="340" y1="152" x2="340" y2="186" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="340" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#444444" dominant-baseline="central">You control the path</text>
<rect x="265" y="210" width="150" height="52" rx="8" fill="#00FF6F"/>
<text x="340" y="231" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#000000" dominant-baseline="central">/home</text>
<text x="340" y="249" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#000000" dominant-baseline="central">any host path you choose</text>
<line x1="340" y1="262" x2="340" y2="296" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="265" y="306" width="150" height="44" rx="8" fill="#888178"/>
<text x="340" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Host filesystem</text>
<rect x="273" y="348" width="134" height="20" rx="4" fill="#00000015"/>
<text x="340" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#000000" dominant-baseline="central">Persists at chosen host path</text>

<!-- ANONYMOUS VOLUME -->
<rect x="458" y="64" width="182" height="316" rx="12" fill="#C4BFB0" stroke="#00000018" stroke-width="0.5"/>
<text x="549" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#000000">Anonymous volume</text>
<rect x="474" y="100" width="150" height="52" rx="8" fill="#000000"/>
<text x="549" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Container</text>
<text x="549" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#D1CCBE" dominant-baseline="central">/home</text>
<line x1="549" y1="152" x2="549" y2="186" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="549" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#444444" dominant-baseline="central">Auto-generated name</text>
<rect x="474" y="210" width="150" height="52" rx="8" fill="#888178"/>
<text x="549" y="231" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" dominant-baseline="central">a3f7b9c2e1d4...</text>
<text x="549" y="249" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#D1CCBE" dominant-baseline="central">random hash</text>
<line x1="549" y1="262" x2="549" y2="296" stroke="#888178" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
<rect x="474" y="306" width="150" height="44" rx="8" fill="#888178" opacity="0.5"/>
<text x="549" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Host filesystem</text>
<rect x="482" y="348" width="134" height="20" rx="4" fill="#00000015"/>
<text x="549" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#000000" dominant-baseline="central">Pruned with docker volume prune</text>

</svg>
