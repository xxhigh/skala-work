<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKALA 스터디 플래너</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="logo">SKALA 스터디 플래너</h1>
      <div class="item-tags">
        <button type="button" id="theme-toggle" aria-label="테마 전환">
          🌙
        </button>
        <p class="today" id="today">2026년 7월 17일</p>
      </div>
    </header>

    <main class="container">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title" class="panel-title">학습 목표 추가</h2>
        <form class="form" id="goal-form">
          <label for="goal-input" class="sr-only">학습 목표</label>
          <input
            type="text"
            placeholder="목표를 입력하세요."
            class="form-input"
            id="goal-input"
          />
          <label for="goal-category" class="sr-only">분류</label>
          <select id="goal-category" class="form-select">
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JS">Javacsript</option>
          </select>
          <label for="goal-due" class="sr-only">마감일</label>
          <input type="date" class="form-input" id="goal-due" />
          <button class="btn btn-primary" type="submit">추가</button>
        </form>
        <p class="form-error" id="form-error" hidden>
          목표를 한 글자 이상 입력해 주세요.
        </p>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="panel-head">
          <h2 id="list-title" class="panel-title">학습 목록</h2>
          <input
            type="text"
            id="search-input"
            class="filter-text"
            placeholder="검색어를 입력하세요."
          />
          <div
            class="tabs"
            id="filter-tabs"
            role="group"
            aria-label="목록 필터"
          >
            <button class="tab is-active" type="button" data-filter="all">
              전체
            </button>
            <button class="tab" type="button" data-filter="active">
              진행중
            </button>
            <button class="tab" type="button" data-filter="done">완료</button>
          </div>
        </div>
        <ul class="list" id="goal-list"></ul>
        <p class="list-empty" id="list-empty">아직 등록된 목표가 없습니다.</p>
        <div class="progress">
          <div class="progress-bar">
            <span class="progress-fill" id="progress-fill"></span>
          </div>
          <p class="progress-text" id="progress-text">전체 0개 중 0개 완료</p>
          <p class="rest-text" id="rest-text"></p>
        </div>
      </section>

      <section class="panel panel-tip">
        <h2 class="panel-title">오늘의 팁</h2>
        <p class="tip" id="tip">불러오는 중...</p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 SKALA·KDT 프로그래밍 기초</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
