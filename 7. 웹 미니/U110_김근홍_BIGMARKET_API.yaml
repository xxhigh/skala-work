openapi: 3.0.3
info:
  title: BIGMARKET API
  version: 1.0.0
  description: |
    BIGMARKET 대형 중고품 거래 플랫폼의 REST API 명세서입니다.
    요구사항 정의서와 화면설계서를 기준으로 회원/인증, 상품, 거래/결제,
    상하차 예약, 채팅, 신고/차단, 알림 기능을 정의합니다.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: 인증 및 회원가입
  - name: Users
    description: 회원 및 프로필 관리
  - name: Categories
    description: 카테고리 조회
  - name: Regions
    description: 지역 조회
  - name: Items
    description: 상품 관리 및 검색
  - name: Favorites
    description: 관심상품 관리
  - name: Recommendations
    description: 개인화 추천
  - name: Transactions
    description: 거래 관리
  - name: Payments
    description: 결제 관리
  - name: Transport
    description: 상하차 예약 관리
  - name: Chats
    description: 채팅방 및 메시지 관리
  - name: Reports
    description: 신고 관리
  - name: Blocks
    description: 사용자 차단 관리
  - name: Notifications
    description: 알림 관리
  - name: KeywordAlerts
    description: 키워드 알림 관리

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 일반 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      responses:
        '204':
          description: 로그아웃 성공

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: 아이디 또는 닉네임 중복

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 갱신
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: OAuth 로그인 시작
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: OAuth 인증 페이지로 리다이렉트
    post:
      tags: [Auth]
      summary: OAuth 인증 결과 처리
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
      responses:
        '200':
          description: OAuth 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/verifications:
    post:
      tags: [Users]
      summary: 본인 인증 요청
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: 인증 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSession'

  /api/v1/verifications/confirm:
    post:
      tags: [Users]
      summary: 본인 인증 확인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationConfirmRequest'
      responses:
        '200':
          description: 인증 성공
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/check-login-id:
    get:
      tags: [Users]
      summary: 아이디 중복 확인
      security: []
      parameters:
        - name: loginId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 중복 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'

  /api/v1/users/check-nickname:
    get:
      tags: [Users]
      summary: 닉네임 중복 확인
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 중복 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: 내 회원정보 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: 프로필 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: 닉네임 중복 또는 변경 주기 정책 위반
    delete:
      tags: [Users]
      summary: 회원 탈퇴
      responses:
        '204':
          description: 탈퇴 처리 성공

  /api/v1/users/me/profile-image:
    post:
      tags: [Users]
      summary: 프로필 이미지 업로드
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  profileImageUrl:
                    type: string
    delete:
      tags: [Users]
      summary: 프로필 이미지 삭제
      responses:
        '204':
          description: 삭제 성공

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: 카테고리 목록 조회
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /api/v1/regions:
    get:
      tags: [Regions]
      summary: 지역 목록 조회
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'

  /api/v1/items:
    get:
      tags: [Items]
      summary: 상품 검색 및 목록 조회
      security: []
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: regionId
          in: query
          schema: { type: integer, format: int64 }
        - name: minPrice
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: condition
          in: query
          schema:
            $ref: '#/components/schemas/ItemCondition'
        - name: transactionMethod
          in: query
          schema: { type: string }
        - name: saleStatus
          in: query
          schema:
            $ref: '#/components/schemas/ItemSaleStatus'
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [LATEST, PRICE_ASC, PRICE_DESC]
            default: LATEST
      responses:
        '200':
          description: 상품 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedItemResponse'
    post:
      tags: [Items]
      summary: 상품 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: 상품 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/{itemId}:
    get:
      tags: [Items]
      summary: 상품 상세 조회
      security: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Items]
      summary: 상품 수정
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Items]
      summary: 상품 삭제
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: 삭제 성공
        '409':
          description: 예약중 또는 거래 진행중으로 삭제 불가

  /api/v1/items/{itemId}/sale-status:
    patch:
      tags: [Items]
      summary: 상품 판매 상태 변경
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaleStatusRequest'
      responses:
        '200':
          description: 상태 변경 성공

  /api/v1/items/{itemId}/media:
    post:
      tags: [Items]
      summary: 상품 이미지/동영상 업로드
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mediaType]
              properties:
                file:
                  type: string
                  format: binary
                mediaType:
                  $ref: '#/components/schemas/MediaType'
      responses:
        '201':
          description: 업로드 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMedia'
        '400':
          description: 형식/용량/최대 개수 정책 위반

  /api/v1/items/{itemId}/media/{mediaId}:
    delete:
      tags: [Items]
      summary: 상품 미디어 삭제
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: 삭제 성공

  /api/v1/items/{itemId}/media/order:
    patch:
      tags: [Items]
      summary: 상품 미디어 순서 변경
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: 순서 변경 성공

  /api/v1/items/{itemId}/thumbnail:
    patch:
      tags: [Items]
      summary: 대표 이미지 지정
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: 대표 이미지 변경 성공

  /api/v1/users/me/items:
    get:
      tags: [Items]
      summary: 내가 등록한 상품 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSummary'

  /api/v1/items/{itemId}/favorites:
    post:
      tags: [Favorites]
      summary: 관심상품 등록
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
    delete:
      tags: [Favorites]
      summary: 관심상품 해제
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: 해제 성공

  /api/v1/users/me/favorites:
    get:
      tags: [Favorites]
      summary: 내 관심상품 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSummary'

  /api/v1/users/me/recent-items:
    get:
      tags: [Items]
      summary: 최근 본 상품 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSummary'

  /api/v1/recommendations/items:
    get:
      tags: [Recommendations]
      summary: 개인화 추천 상품 조회
      responses:
        '200':
          description: 추천 결과 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSummary'

  /api/v1/transactions:
    post:
      tags: [Transactions]
      summary: 거래 시작
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: 거래 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '409':
          description: 이미 판매완료 또는 거래 진행 중인 상품

  /api/v1/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: 거래 상세 조회
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me/transactions:
    get:
      tags: [Transactions]
      summary: 내 거래 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /api/v1/transactions/{transactionId}/complete:
    post:
      tags: [Transactions]
      summary: 거래 완료 처리
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 거래 완료 처리 성공

  /api/v1/transactions/{transactionId}/cancel:
    post:
      tags: [Transactions]
      summary: 거래 취소
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 거래 취소 성공

  /api/v1/transactions/{transactionId}/payments:
    post:
      tags: [Payments]
      summary: 결제 요청
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: 결제 요청 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: 결제 상태 조회
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /api/v1/payments/{paymentId}/cancel:
    post:
      tags: [Payments]
      summary: 결제 취소
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 결제 취소 성공

  /api/v1/payments/{paymentId}/refund:
    post:
      tags: [Payments]
      summary: 환불 요청
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 환불 요청 성공

  /api/v1/transactions/{transactionId}/transport-reservations:
    post:
      tags: [Transport]
      summary: 상하차 예약 생성
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransportReservationRequest'
      responses:
        '201':
          description: 예약 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReservation'
        '400':
          description: 상하차 시간 또는 주소 정책 위반

  /api/v1/transactions/{transactionId}/transport-reservation:
    get:
      tags: [Transport]
      summary: 거래의 상하차 예약 조회
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReservation'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/transport-reservations/{reservationId}:
    patch:
      tags: [Transport]
      summary: 상하차 예약 변경
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransportReservationRequest'
      responses:
        '200':
          description: 예약 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReservation'
    delete:
      tags: [Transport]
      summary: 상하차 예약 취소
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '204':
          description: 예약 취소 성공

  /api/v1/chat-rooms:
    get:
      tags: [Chats]
      summary: 내 채팅방 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatRoom'
    post:
      tags: [Chats]
      summary: 채팅방 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: 채팅방 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'

  /api/v1/chat-rooms/{chatRoomId}:
    get:
      tags: [Chats]
      summary: 채팅방 정보 조회
      parameters:
        - $ref: '#/components/parameters/ChatRoomId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'

  /api/v1/chat-rooms/{chatRoomId}/messages:
    get:
      tags: [Chats]
      summary: 채팅 메시지 목록 조회
      parameters:
        - $ref: '#/components/parameters/ChatRoomId'
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      tags: [Chats]
      summary: 메시지 전송
      parameters:
        - $ref: '#/components/parameters/ChatRoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: 메시지 전송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/v1/chat-rooms/{chatRoomId}/messages/read:
    patch:
      tags: [Chats]
      summary: 채팅 메시지 읽음 처리
      parameters:
        - $ref: '#/components/parameters/ChatRoomId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lastReadMessageId:
                  type: integer
                  format: int64
      responses:
        '204':
          description: 읽음 처리 성공

  /api/v1/users/{userId}/blocks:
    post:
      tags: [Blocks]
      summary: 사용자 차단
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 차단 성공
    delete:
      tags: [Blocks]
      summary: 사용자 차단 해제
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 차단 해제 성공

  /api/v1/users/me/blocks:
    get:
      tags: [Blocks]
      summary: 차단 사용자 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'

  /api/v1/reports:
    post:
      tags: [Reports]
      summary: 신고 접수
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: 신고 접수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /api/v1/users/me/reports:
    get:
      tags: [Reports]
      summary: 내 신고 내역 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: 알림 목록 조회
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /api/v1/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: 알림 읽음 처리
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: 읽음 처리 성공

  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: 알림 전체 읽음 처리
      responses:
        '204':
          description: 전체 읽음 처리 성공

  /api/v1/keyword-alerts:
    get:
      tags: [KeywordAlerts]
      summary: 내 키워드 알림 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeywordAlert'
    post:
      tags: [KeywordAlerts]
      summary: 키워드 알림 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeywordAlertRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordAlert'

  /api/v1/keyword-alerts/{alertId}:
    patch:
      tags: [KeywordAlerts]
      summary: 키워드 알림 수정
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeywordAlertRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordAlert'
    delete:
      tags: [KeywordAlerts]
      summary: 키워드 알림 삭제
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '204':
          description: 삭제 성공

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, naver, kakao]
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChatRoomId:
      name: chatRoomId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          example: hong123
        password:
          type: string
          format: password
          example: password123!

    SignupRequest:
      type: object
      required: [loginId, password, nickname, verificationToken]
      properties:
        loginId:
          type: string
        password:
          type: string
          format: password
        nickname:
          type: string
        verificationToken:
          type: string
          description: 본인 인증 완료 후 발급되는 토큰

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    OAuthCallbackRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        state:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/User'

    VerificationRequest:
      type: object
      required: [phoneNumber, method]
      properties:
        phoneNumber:
          type: string
          example: '01012345678'
        method:
          type: string
          enum: [PASS, SMS]

    VerificationConfirmRequest:
      type: object
      required: [sessionId, code]
      properties:
        sessionId: { type: string }
        code: { type: string }

    VerificationSession:
      type: object
      properties:
        sessionId: { type: string }
        expiresAt: { type: string, format: date-time }

    AvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, WITHDRAWN]

    User:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        loginId: { type: string }
        nickname: { type: string }
        profileImageUrl: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt: { type: string, format: date-time }

    UserSummary:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        profileImageUrl: { type: string, nullable: true }

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string

    Category:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        parentCategoryId: { type: integer, format: int64, nullable: true }
        name: { type: string }

    Region:
      type: object
      properties:
        regionId: { type: integer, format: int64 }
        parentRegionId: { type: integer, format: int64, nullable: true }
        name: { type: string }

    ItemCondition:
      type: string
      enum: [NEW, USED, DAMAGED]

    ItemSaleStatus:
      type: string
      enum: [ON_SALE, RESERVED, SOLD]

    MediaType:
      type: string
      enum: [IMAGE, VIDEO]

    CreateItemRequest:
      type: object
      required: [categoryId, title, description, condition, price]
      properties:
        categoryId: { type: integer, format: int64 }
        regionId: { type: integer, format: int64, nullable: true }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        condition:
          $ref: '#/components/schemas/ItemCondition'
        price: { type: integer, format: int64, minimum: 0 }
        transactionMethod: { type: string, nullable: true }

    UpdateItemRequest:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        regionId: { type: integer, format: int64, nullable: true }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        condition:
          $ref: '#/components/schemas/ItemCondition'
        price: { type: integer, format: int64, minimum: 0 }
        transactionMethod: { type: string, nullable: true }

    UpdateSaleStatusRequest:
      type: object
      required: [saleStatus]
      properties:
        saleStatus:
          $ref: '#/components/schemas/ItemSaleStatus'
        buyerId:
          type: integer
          format: int64
          nullable: true
          description: 판매완료 처리 시 구매자 지정용

    ItemMedia:
      type: object
      properties:
        mediaId: { type: integer, format: int64 }
        mediaType:
          $ref: '#/components/schemas/MediaType'
        mediaUrl: { type: string }
        displayOrder: { type: integer }
        thumbnail: { type: boolean }

    ItemSummary:
      type: object
      properties:
        itemId: { type: integer, format: int64 }
        title: { type: string }
        price: { type: integer, format: int64 }
        thumbnailUrl: { type: string, nullable: true }
        saleStatus:
          $ref: '#/components/schemas/ItemSaleStatus'
        regionName: { type: string, nullable: true }
        favorite: { type: boolean, default: false }

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/ItemSummary'
        - type: object
          properties:
            description: { type: string }
            condition:
              $ref: '#/components/schemas/ItemCondition'
            seller:
              $ref: '#/components/schemas/UserSummary'
            category:
              $ref: '#/components/schemas/Category'
            region:
              $ref: '#/components/schemas/Region'
            media:
              type: array
              items:
                $ref: '#/components/schemas/ItemMedia'
            transactionMethod: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }

    PagedItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    FavoriteResponse:
      type: object
      properties:
        itemId: { type: integer, format: int64 }
        favorited: { type: boolean }

    TransactionStatus:
      type: string
      enum:
        - PAYMENT_PENDING
        - SELLER_CONFIRMING
        - TRANSPORT_RESERVED
        - COMPLETED
        - CANCELLED
        - REFUNDED
        - DISPUTED

    Transaction:
      type: object
      properties:
        transactionId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        buyerId: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/TransactionStatus'
        itemPrice: { type: integer, format: int64 }
        feeAmount: { type: integer, format: int64 }
        totalAmount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }

    PaymentProvider:
      type: string
      enum: [NAVER_PAY, KAKAO_PAY, TOSS_PAY, OTHER]

    PaymentStatus:
      type: string
      enum: [PENDING, PAID, FAILED, CANCELLED, REFUNDED]

    CreatePaymentRequest:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/PaymentProvider'

    Payment:
      type: object
      properties:
        paymentId: { type: integer, format: int64 }
        transactionId: { type: integer, format: int64 }
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        amount: { type: integer, format: int64 }
        feeAmount: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/PaymentStatus'
        pgTransactionId: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }

    TransportPoint:
      type: object
      required: [address, scheduledAt]
      properties:
        address: { type: string }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        scheduledAt: { type: string, format: date-time }

    CreateTransportReservationRequest:
      type: object
      required: [pickup, dropoff]
      properties:
        pickup:
          $ref: '#/components/schemas/TransportPoint'
        dropoff:
          $ref: '#/components/schemas/TransportPoint'

    ReservationStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]

    TransportReservation:
      type: object
      properties:
        reservationId: { type: integer, format: int64 }
        transactionId: { type: integer, format: int64 }
        pickup:
          $ref: '#/components/schemas/TransportPoint'
        dropoff:
          $ref: '#/components/schemas/TransportPoint'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        reservationFee: { type: integer, format: int64 }
        cancellationFee: { type: integer, format: int64 }

    ChatRoom:
      type: object
      properties:
        chatRoomId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        transactionId: { type: integer, format: int64, nullable: true }
        seller:
          $ref: '#/components/schemas/UserSummary'
        buyer:
          $ref: '#/components/schemas/UserSummary'
        createdAt: { type: string, format: date-time }

    MessageType:
      type: string
      enum: [TEXT, IMAGE, LOCATION, SYSTEM]

    CreateMessageRequest:
      type: object
      required: [messageType]
      properties:
        messageType:
          $ref: '#/components/schemas/MessageType'
        content: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        locationAddress: { type: string, nullable: true }

    Message:
      type: object
      properties:
        messageId: { type: integer, format: int64 }
        chatRoomId: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        messageType:
          $ref: '#/components/schemas/MessageType'
        content: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        locationAddress: { type: string, nullable: true }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    ReportType:
      type: string
      enum: [USER, ITEM, MESSAGE]

    ReportStatus:
      type: string
      enum: [RECEIVED, REVIEWING, RESOLVED, REJECTED]

    CreateReportRequest:
      type: object
      required: [reportType, targetId, reason]
      properties:
        reportType:
          $ref: '#/components/schemas/ReportType'
        targetId: { type: integer, format: int64 }
        reason: { type: string }
        description: { type: string, nullable: true }

    Report:
      type: object
      properties:
        reportId: { type: integer, format: int64 }
        reportType:
          $ref: '#/components/schemas/ReportType'
        targetId: { type: integer, format: int64 }
        reason: { type: string }
        description: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt: { type: string, format: date-time }

    NotificationType:
      type: string
      enum:
        - CHAT_MESSAGE
        - PRICE_CHANGED
        - TRANSACTION_CHANGED
        - KEYWORD_MATCHED
        - RESERVATION_CHANGED

    Notification:
      type: object
      properties:
        notificationId: { type: integer, format: int64 }
        type:
          $ref: '#/components/schemas/NotificationType'
        title: { type: string }
        content: { type: string, nullable: true }
        referenceType: { type: string, nullable: true }
        referenceId: { type: integer, format: int64, nullable: true }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateKeywordAlertRequest:
      type: object
      required: [keyword]
      properties:
        keyword: { type: string }
        categoryId: { type: integer, format: int64, nullable: true }
        regionId: { type: integer, format: int64, nullable: true }
        minPrice: { type: integer, format: int64, minimum: 0, nullable: true }
        maxPrice: { type: integer, format: int64, minimum: 0, nullable: true }
        active: { type: boolean, default: true }

    KeywordAlert:
      allOf:
        - $ref: '#/components/schemas/CreateKeywordAlertRequest'
        - type: object
          properties:
            keywordAlertId: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: 잘못된 요청입니다.
        timestamp:
          type: string
          format: date-time
